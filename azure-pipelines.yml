trigger:
  - master

pool:
  vmImage: 'macOS-14'

jobs:
- job: sonar
  displayName: Analyse code with SonarQube

  steps:
  - task: SonarCloudPrepare@3
    displayName: 'Prepare SonarCloud analysis'
    inputs:
      SonarCloud: 'SonarCloud'
      organization: 'aqualityautomation'
      scannerMode: 'CLI'
      configMode: 'file'
      extraProperties: 'sonar.coverage.exclusions=**/**'

  - task: Maven@4
    displayName: 'Build project'
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.11'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      goals: 'clean'
      mavenVersionOption: 'Default'
      mavenAuthenticateFeed: false
      effectivePomSkip: false
      sonarQubeRunAnalysis: false

  - task: SonarCloudAnalyze@4
    inputs:
      jdkversion: 'JAVA_HOME_21_X64'
    displayName: 'Run SonarCloud code analysis'
    continueOnError: true

  - task: SonarCloudPublish@3
    displayName: 'Publish SonarCloud quality gate results'
    inputs:
      pollingTimeoutSec: '300'

- job: tests
  displayName: Run tests
  strategy:
    maxParallel: 2
    matrix:
      ANDROID:
        PLATFORM_NAME: android
        ANDROID_EMU_NAME: test
        ANDROID_SDK_ID: system-images;android-28;google_apis_playstore;x86_64
      IOS:
        PLATFORM_NAME: ios
        IOS_SIM_ID: iPhone-SE-3rd-generation, 17.0
        IOS_SIM_NAME: iPhone SE (3rd generation)
        XCODE_VERSION: 15.0.1
        IOS_VERSION_TYPE: iOS-17.0

  steps:

  - task: CmdLine@2
    displayName: 'Configure and start Android emulator'
    inputs:
      script: |        
        echo "Configuring Environment"
        brew install --cask temurin@8
        export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
        export PATH=$JAVA_HOME/bin:$PATH
        echo export "ANDROID_HOME=\$ANDROID_HOME" >> ~/.bash_profile
        export PATH=$PATH:$ANDROID_HOME
        
        echo "ANDROID_HOME: ${ANDROID_HOME}"
        echo "JAVA_HOME: ${JAVA_HOME}"
        echo "PATH: ${PATH}"
        
        echo "y" | $ANDROID_HOME/tools/bin/sdkmanager "$(ANDROID_SDK_ID)"
        echo "no" | $ANDROID_HOME/tools/bin/avdmanager create avd -n "$(ANDROID_EMU_NAME)" -k "$(ANDROID_SDK_ID)" -f
        $ANDROID_HOME/emulator/emulator -list-avds

        echo "Starting emulator"
        nohup $ANDROID_HOME/emulator/emulator -avd "$(ANDROID_EMU_NAME)" -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-window -camera-back none -verbose > /dev/null 2>&1 &
        $ANDROID_HOME/platform-tools/adb wait-for-device
        for i in {1..300}; do
            $ANDROID_HOME/platform-tools/adb shell pm list packages >/dev/null 2>&1 && break
            sleep 2
        done
        if [[ $i -eq 300 ]]; then
          echo "Emulator failed to boot in time" >&2
          exit 1
        fi
        $ANDROID_HOME/platform-tools/adb devices
        echo "Emulator started"
    condition: and(succeeded(), eq(variables['PLATFORM_NAME'], 'android'))

  - task: CmdLine@2
    displayName: 'Start iOS simulator'
    inputs:
      script: |
        echo "Available Xcode versions:"
        ls /Applications | grep 'Xcode'
        echo "Currently selected Xcode:"
        xcode-select --print-path
        xcodebuild -version
        echo "Setup Xcode"
        sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer
        echo "Selected Xcode after switching:"
        xcode-select --print-path
        xcodebuild -version
        
        SIM_UID="$(xcrun simctl list devices | grep -m 1 "$IOS_SIM_NAME" | grep -E -o -i "([0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12})")"
        echo "SIM_UID: ${SIM_UID}"
        if [[ -z "$SIM_UID" ]]; then
          echo "Simulator '$IOS_SIM_NAME' not found. Available devices:" >&2
          xcrun simctl list devices
          exit 1
        fi
        
        echo "Deleting device then recreate and boot ${IOS_SIM_ID} simulator"
        xcrun simctl erase $SIM_UID
        xcrun simctl delete $SIM_UID
        xcrun simctl delete unavailable
        xcrun simctl erase all
        SIM_UID=$(xcrun simctl create "$IOS_SIM_NAME" "$IOS_SIM_NAME" "$IOS_VERSION_TYPE")
        xcrun simctl boot $SIM_UID

        echo "Wait for simulator to be ready"
        xcrun simctl list devices
        xcrun simctl bootstatus $SIM_UID
    condition: and(succeeded(), eq(variables['PLATFORM_NAME'], 'ios'))

  - task: CmdLine@2
    displayName: 'Configure Appium'
    inputs:
      script: |
        echo "Configuring Environment"
        export PATH=$PATH:$JAVA_HOME/bin
        echo export "ANDROID_HOME=\$ANDROID_HOME" >> ~/.bash_profile
        export PATH=$PATH:$ANDROID_HOME

        echo "ANDROID_HOME: ${ANDROID_HOME}"
        echo "JAVA_HOME: ${JAVA_HOME}"
        echo "PATH: ${PATH}"

        echo "Installing Appium"
        npm install -g appium@3
        ln -fs /usr/local/lib/node_modules/appium/build/lib/main.js /usr/local/bin/appium
        chmod +x /usr/local/bin/appium
        export PATH=$PATH:/usr/local/bin/appium
        appium --version
        echo "Appium installed"

        echo "Installing and Running Appium doctor"
        npm install -g request@2.34.0
        npm install @appium/doctor -g
        ln -fs /usr/local/lib/node_modules/appium-doctor/appium-doctor.js /usr/local/bin/appium-doctor
        chmod +x /usr/local/bin/appium-doctor
        export PATH=$PATH:/usr/local/bin/appium-doctor
        appium-doctor
        echo "Appium doctor installed and executed"

  - task: CmdLine@2
    displayName: 'Configure XCUITest driver'
    inputs:
      script: |
        echo "Installing XCUITest driver"
        appium driver install xcuitest
        appium driver list
        echo "XCUITest driver installed"
    condition: and(succeeded(), eq(variables['PLATFORM_NAME'], 'ios'))

  - task: CmdLine@2
    displayName: 'Configure UIA2 driver'
    inputs:
      script: |
        echo "Installing UIA2 driver"
        appium driver install uiautomator2
        appium driver list
        echo "UIA2 driver installed"
    condition: and(succeeded(), eq(variables['PLATFORM_NAME'], 'android'))

  - task: CmdLine@2
    displayName: 'Start Appium server'
    inputs:
      script: |
        appium --allow-insecure uiautomator2:chromedriver_autodownload --base-path /wd/hub &
        echo "Appium server started"
    condition: succeeded()

  - task: Maven@4
    displayName: 'Run tests'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'test -DisRemote=true -DplatformName=$(PLATFORM_NAME)'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.11'
      mavenVersionOption: 'Default'
      mavenAuthenticateFeed: false
      effectivePomSkip: false
      sonarQubeRunAnalysis: false
    condition: succeeded()

  - task: CopyFiles@2
    displayName: 'Copy failure screenshots and test logs'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/aquality-appium-mobile-template-cucumber/target'
      Contents: |
        surefire-reports/failure_screenshots/*.png
        log/*.log
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    condition: succeededOrFailed()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish copied artifacts'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop_$(PLATFORM_NAME)'
      publishLocation: 'Container'
    condition: succeededOrFailed()
